    <circle cx="210" cy="75" r="220" fill="url(#glow)"/>
    <circle cx="1010" cy="100" r="260" fill="#8b2cff" opacity=".10" filter="url(#blur)"/>
    <g fill="#e6fbff">
      <circle cx="75" cy="53" r="1.5"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="167" cy="111" r="1"><animate attributeName="opacity" values="1;.25;1" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="305" cy="43" r="1.4"><animate attributeName="opacity" values=".15;1;.15" dur="3.7s" repeatCount="indefinite"/></circle>
      <circle cx="450" cy="75" r="1"><animate attributeName="opacity" values=".3;1;.3" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="705" cy="38" r="1.4"><animate attributeName="opacity" values="1;.2;1" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="878" cy="78" r="1.2"><animate attributeName="opacity" values=".25;1;.25" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="1090" cy="50" r="1.5"><animate attributeName="opacity" values=".2;1;.2" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="1132" cy="146" r="1"><animate attributeName="opacity" values="1;.2;1" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="960" cy="190" r="1.2"><animate attributeName="opacity" values=".2;1;.2" dur="2.9s" repeatCount="indefinite"/></circle>
    </g>
    <path d="M-40 218 C160 105 265 275 475 170 S820 95 1240 195 L1240 340 L-40 340Z" fill="url(#wave)">
      <animate attributeName="d" dur="12s" repeatCount="indefinite" values="M-40 218 C160 105 265 275 475 170 S820 95 1240 195 L1240 340 L-40 340Z;M-40 185 C160 255 285 110 490 190 S830 260 1240 140 L1240 340 L-40 340Z;M-40 218 C160 105 265 275 475 170 S820 95 1240 195 L1240 340 L-40 340Z"/>
    </path>
    <path d="M0 250 Q300 180 600 250 T1200 230" fill="none" stroke="url(#neon)" stroke-opacity=".6" stroke-width="1.5">
      <animate attributeName="d" dur="9s" repeatCount="indefinite" values="M0 250 Q300 180 600 250 T1200 230;M0 230 Q300 290 600 220 T1200 250;M0 250 Q300 180 600 250 T1200 230"/>
    </path>
    <path d="M0 265 Q300 195 600 265 T1200 245" fill="none" stroke="#00eaff" stroke-opacity=".32" stroke-width="1"/>
    <path d="M0 240 Q300 170 600 240 T1200 220" fill="none" stroke="#ff3cac" stroke-opacity=".28" stroke-width="1"/>
    <g transform="translate(0 185)">
      <path d="M0 0H1200L1200 145H0Z" fill="url(#grid)" opacity=".9"/>
      <path d="M0 0H1200" stroke="#00eaff" stroke-opacity=".3"/>
      <path d="M0 0L600 145M120 0L600 145M240 0L600 145M360 0L600 145M480 0L600 145M720 0L600 145M840 0L600 145M960 0L600 145M1080 0L600 145M1200 0L600 145" fill="none" stroke="#6b5cff" stroke-opacity=".2"/>
    </g>
    <rect x="30" y="28" width="1140" height="274" rx="8" fill="none" stroke="url(#neon)" stroke-opacity=".45"/>
    <path d="M30 66V28H68M1132 28H1170V66M30 264V302H68M1132 302H1170V264" fill="none" stroke="#00f5ff" stroke-width="2.5"/>
    <g font-family="'Orbitron','Rajdhani','Arial Black',sans-serif" text-anchor="middle">
      <text x="604" y="137" font-size="58" font-weight="900" letter-spacing="5" fill="#00eaff" opacity=".75" filter="url(#glowText)">dARSHANdR4</text>
      <text x="600" y="133" font-size="58" font-weight="900" letter-spacing="5" fill="#f4f7ff">dARSHANdR4</text>
      <text x="600" y="174" font-size="17" font-weight="700" letter-spacing="5" fill="#ff70d0">DEVELOPER  /  BUILDER  /  CREATOR</text>
      <text x="600" y="286" font-size="11" letter-spacing="4" fill="#9ab7d8">IDEAS INTO DIGITAL EXPERIENCES  •  EST. 2026</text>
    </g>
    <rect x="0" y="0" width="1200" height="330" fill="#fff" opacity=".025">
