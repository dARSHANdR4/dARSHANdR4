<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">dARSHANdR4 — Neon Cyber Profile Banner</title>
  <desc id="desc">Dark cyberpunk profile banner with animated neon waves, stars, a perspective grid, and bold futuristic typography.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070914"/>
      <stop offset=".48" stop-color="#11132b"/>
      <stop offset="1" stop-color="#071d2b"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f5ff"/>
      <stop offset=".48" stop-color="#7c4dff"/>
      <stop offset="1" stop-color="#ff3cac"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f5ff" stop-opacity=".05"/>
      <stop offset=".5" stop-color="#7c4dff" stop-opacity=".24"/>
      <stop offset="1" stop-color="#ff3cac" stop-opacity=".05"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#00eaff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#00eaff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="30" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V30" fill="none" stroke="#4d8aff" stroke-opacity=".22" stroke-width="1"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="glowText" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1200" height="330" rx="10"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
